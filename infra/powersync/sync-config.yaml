# Sync Streams: every stream is scoped to workspaces the authenticated user (JWT sub) belongs to.
config:
  edition: 3

streams:
  workspaces:
    auto_subscribe: true
    query: |
      SELECT * FROM workspaces
      WHERE id IN (SELECT workspace_id FROM workspace_members WHERE user_id = auth.user_id())

  workspace_members:
    auto_subscribe: true
    query: |
      SELECT * FROM workspace_members
      WHERE workspace_id IN (SELECT workspace_id FROM workspace_members WHERE user_id = auth.user_id())

  # Pages and databases: small, needed for the sidebar tree, always synced.
  sidebar_nodes:
    auto_subscribe: true
    query: |
      SELECT * FROM nodes
      WHERE kind != 'db_row'
        AND workspace_id IN (SELECT workspace_id FROM workspace_members WHERE user_id = auth.user_id())

  # Database rows: potentially large, synced only while a client has that database open.
  database_rows:
    query: |
      SELECT * FROM nodes
      WHERE kind = 'db_row'
        AND parent_id = subscription.parameter('database_id')
        AND workspace_id IN (SELECT workspace_id FROM workspace_members WHERE user_id = auth.user_id())
